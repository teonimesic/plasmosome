name = "guest-kernel"
purpose = """\
  The Linux kernel the cell's guest boots under spec 001 §4.2, as kernel format raw, with the \
  protected initramfs and the fixed command line. plasmosome-lanes' test lanes boot it today.\
  """
version = "6.12.91"
bundle_manifest_sha256 = "eed141b574337d9911885a839b9afe6835ee5aa27472bbd41ee768f108266b3f"
file = "boot/kernel"
sha256 = "694461b39b69b9d6919c3329b92554db88179d4ac977b1d6fea2e956b0fdc8c7"
sources = [
  """\
  Linux 6.12.91: linux-6.12.91.tar.xz from https://cdn.kernel.org/pub/linux/kernel/v6.x/, \
  SHA-256 0ff2ab9e169f9f1948557471fbb450d3018f8c5b77caf288e1a3982582597969.\
  """,
  """\
  libkrunfw v5.5.0, https://github.com/containers/libkrunfw at commit \
  ec4b297964877d83432f9ccda6dad8ff6e9de3e4: its 30 patches in patches/, and \
  config-libkrunfw_aarch64, SHA-256 \
  596a4921a62f7c03936c6142f202f90db71d039fd1fc8d217231d0aefdcfc0c6.\
  """,
  """\
  One change to that config, authorized by Main on 2026-09-18 in plasmosome-itt: the protected \
  initramfs of spec 001 §4.2 needs CONFIG_BLK_DEV_INITRD, which upstream's config leaves unset. \
  Two lines are appended, `# plasmosome-itt named deviation (Main-authorized 2026-09-18): \
  CONFIG_BLK_DEV_INITRD=y` and `CONFIG_BLK_DEV_INITRD=y`. The config used has SHA-256 \
  9dc49d1bd3c919fdddecb2730a4293d195821068e8eda55b5374ebbdb1cf2821.\
  """,
  """\
  Built by plasmosome-itt on 2026-09-18 with make olddefconfig and make Image, inside a Debian \
  12 arm64 VM under QEMU 11.1.1 with HVF. The file is that build's arm64 Image, 24,176,648 \
  bytes. The same build's libkrunfw embeds these bytes padded with zeros to 24,182,784, the size \
  that manifest.json's kernel_extraction reports.\
  """,
]
licence = "GPL-2.0-only WITH Linux-syscall-note"
limits = [
  """\
  CONFIG_SECURITY is not set in the config used, so the guest kernel has no security modules \
  and no mandatory access control (spec 027, "Blocked on"). Spec 026's threat model claims no \
  file or exec enforcement inside the guest until owner gate O-7 is settled.\
  """,
  """\
  Whoever distributes this binary must also make its corresponding source available: the \
  tarball, the patches and the config used, which sources names (GPL-2.0, section 3, and \
  libkrunfw's README at ec4b2979, "License"). No workflow in this repository publishes a \
  bundle today, so the duty falls on the first release that ships one.\
  """,
]

[checks]
cadence = "weekly"
updates = """\
  Compare 6.12.91 with the newest 6.12 stable release on https://www.kernel.org, and v5.5.0 \
  with the newest release of https://github.com/containers/libkrunfw. A new pin takes \
  libkrunfw's kernel version, patches and config together.\
  """
advisories = """\
  Read the Linux kernel CNA's announcements, https://lore.kernel.org/linux-cve-announce/, for \
  fixes in 6.12 releases after 6.12.91, and keep those in code that the config used builds. \
  Read the GitHub security advisories of https://github.com/containers/libkrunfw too.\
  """
by = "Nobody, until the owner answers spec 026 Q6."
last = "never"
