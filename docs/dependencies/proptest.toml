name = "proptest"
range = "1"
reason = """\
  Generates random inputs for property tests from composable strategies, runs each property over \
  many cases, and shrinks a failing input to a small one before it reports it.\
  """
write_it_instead.lines = 1840
write_it_instead.how = """\
  On 2026-10-20, at main ec4603c, `git grep -l proptest -- '*.rs' | wc -l` gives 5 files: two \
  integration tests and three unit-test modules. \
  `git grep -h -o -E '(proptest|prop_assert_eq|prop_assert|prop_oneof)!' -- '*.rs' | sort | \
  uniq -c` gives prop_assert_eq! 11, prop_assert! 7, prop_oneof! 7 and proptest! 5. \
  `git grep -h -o -E 'prop_(map|flat_map|filter|recursive)' -- '*.rs' | sort | uniq -c` gives \
  prop_filter 2, prop_flat_map 2, prop_map 11 and prop_recursive 1. \
  `git grep -h -o -E 'any::<[A-Za-z0-9:]+>' -- '*.rs' | sort | uniq -c` gives any::<char> 2, \
  any::<i64> 1, any::<prop::sample::Index> 2 and any::<u8> 1. \
  `git grep -h -o -E '(collection::vec|sample::select|option::of)' -- '*.rs' | sort | uniq -c` \
  gives collection::vec 8, option::of 1 and sample::select 3, and \
  `git grep -h -o -F 'Just(' -- '*.rs' | wc -l` gives 10. Two regular expressions serve as \
  string strategies: `git grep -h -o -F '[a-z0-9]{1,8}(-[a-z0-9]{1,8}){0,3}' -- '*.rs' | wc -l` \
  gives 3, and `git grep -h -o -F '\\PC{0,8}' -- '*.rs' | wc -l` gives 2. Reading the five \
  files adds ProptestConfig::with_cases, a struct update of ProptestConfig::default, integer \
  ranges of u8, u32 and usize, and tuples of up to four strategies. Both proptest and its \
  replacement serve tests only, so the replacement would be a module or crate that only test \
  builds link, and the scale counts its lines all the same. It needs: the proptest! macro, with \
  an optional #![proptest_config] and pattern-in-strategy arguments, tuple patterns included \
  (60); prop_assert! and prop_assert_eq!, with optional messages (30); a Config with a public \
  cases field, Default and with_cases (30); a seeded random generator and unbiased sampling from \
  ranges, since std has neither (40); the runner, which runs the cases, catches panics and \
  bounds how many cases a filter may reject (80); the shrink loop and the failure report (50); \
  the Strategy and ValueTree traits, with boxing (60); prop_map (30), prop_flat_map (60), \
  prop_filter (40) and prop_recursive (60); Just (15); the weighted union behind prop_oneof!, \
  with the macro (100); integer ranges, half-open and inclusive, with binary-search shrinking \
  (80); any for u8, i64 and char (60); prop::sample::Index (30), prop::sample::select (30) and \
  prop::option::of (30); collection::vec with a size range, shrinking by dropping elements and \
  then shrinking each (100); tuples of up to four strategies (50); the identifier pattern as a \
  composed strategy (25); and \\PC{0,8} as up to eight characters outside Unicode's category C \
  (40), with that category as the table of 736 ranges that regex-syntax 0.8.11 holds, one range \
  per line (740): 1840 lines. The call sites would name the two string strategies instead of \
  passing the patterns. Drawing any character for which char::is_control is false would take \
  about 20 lines in place of the table, but it would also draw the format, private-use and \
  unassigned characters that \\PC leaves out. Not counted, because no test uses them: fork and \
  timeout, which the default features turn on through rusty-fork but which no config sets; \
  failure persistence, since no proptest-regressions file is committed; prop_compose! and \
  prop_assume!. Replacing it removes 17 packages from Cargo.lock: bit-set@0.8, bit-vec@0.8, \
  fnv@1, getrandom@0.3, ppv-lite86@0.2, proptest@1, quick-error@1, r-efi@5, rand@0.9, \
  rand_chacha@0.9, rand_core@0.9, rand_xorshift@0.4, rusty-fork@0.3, unarray@0.1, \
  wait-timeout@0.2, wasip2@1 and wit-bindgen@0.57. Replacing criterion as well removes six more, \
  which each of the two keeps for the other: autocfg@1, num-traits@0.2, regex-syntax@0.8, \
  syn@2, zerocopy@0.8 and zerocopy-derive@0.8.\
  """
exception = ""
brings = [
  "autocfg@1",
  "bit-set@0.8",
  "bit-vec@0.8",
  "bitflags@2",
  "cfg-if@1",
  "errno@0.3",
  "fastrand@2",
  "fnv@1",
  "getrandom@0.3",
  "getrandom@0.4",
  "libc@0.2",
  "linux-raw-sys@0.12",
  "num-traits@0.2",
  "once_cell@1",
  "ppv-lite86@0.2",
  "proc-macro2@1",
  "quick-error@1",
  "quote@1",
  "r-efi@5",
  "r-efi@6",
  "rand@0.9",
  "rand_chacha@0.9",
  "rand_core@0.9",
  "rand_xorshift@0.4",
  "regex-syntax@0.8",
  "rustix@1",
  "rusty-fork@0.3",
  "syn@2",
  "tempfile@3",
  "unarray@0.1",
  "unicode-ident@1",
  "wait-timeout@0.2",
  "wasip2@1",
  "windows-link@0.2",
  "windows-sys@0.61",
  "wit-bindgen@0.57",
  "zerocopy-derive@0.8",
  "zerocopy@0.8",
]
# zerocopy-derive builds because half, which criterion brings, turns on zerocopy's derive feature,
# and the resolve unifies features across the workspace. proptest's own path, through ppv-lite86,
# turns on only zerocopy's simd feature.
build_time_code = [
  "getrandom@0.3 build script",
  "getrandom@0.4 build script",
  "libc@0.2 build script",
  "num-traits@0.2 build script",
  "proc-macro2@1 build script",
  "quote@1 build script",
  "rustix@1 build script",
  "zerocopy-derive@0.8 proc macro",
  "zerocopy@0.8 build script",
]
# proptest exports proptest!, prop_assume!, prop_oneof!, prop_compose!, prop_assert!,
# prop_assert_eq!, prop_assert_ne! and the hidden proptest_helper!, and none of them writes unsafe.
# prop_compose! copies an [unsafe] modifier onto the function it defines only when a caller
# writes one.
expands_unsafe = "none"
# getrandom 0.3 and 0.4 name advapi32, bcryptprimitives and zircon in #[link(name)]. Those apply
# on Windows and Fuchsia only. On macOS and Linux both call the C library through libc.
native_code = [
  """\
  libc@0.2 links the system libiconv on macOS, through the #[link(name = "iconv")] that \
  libc.toml describes. libc builds here because getrandom 0.3, getrandom 0.4 and wait-timeout \
  depend on it on both hosts, and errno and rustix on macOS. It compiles no C.\
  """,
]
verdict = "kept-pending-owner"
