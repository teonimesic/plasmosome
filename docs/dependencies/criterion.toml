name = "criterion"
range = "0.7"
reason = """\
  Runs in-process benchmarks. It warms up, times many samples, estimates each median and flags \
  outliers, and writes the estimates as JSON for CI to read.\
  """
write_it_instead.lines = 550
write_it_instead.how = """\
  On 2026-10-20, at main 1d93c81, `git grep -l 'criterion::' -- '*.rs' | wc -l` gives 6 files, \
  one per benchmark target. \
  `git grep -h -o -E '(criterion_group|criterion_main)!' -- '*.rs' | sort | uniq -c` gives \
  criterion_group! 6 and criterion_main! 6. \
  `git grep -h -o -E '(c|group)\\.(bench_function|benchmark_group|finish)' -- '*.rs' | sort | \
  uniq -c` gives c.bench_function 5, c.benchmark_group 1, group.bench_function 1 and \
  group.finish 1. `git grep -h -o -E 'b\\.iter[a-z_]*' -- '*.rs' | sort | uniq -c` gives b.iter \
  3, b.iter_batched 2 and b.iter_batched_ref 1, and \
  `git grep -h -o -E 'BatchSize::[A-Za-z]+' -- '*.rs' | sort | uniq -c` gives PerIteration 1 and \
  SmallInput 2. CI runs cargo bench with --quick and reads median.point_estimate from \
  new/estimates.json under target/criterion for each of eight benchmark ids. Both criterion and \
  its replacement serve benchmarks only, so the replacement would be a crate that only bench \
  targets link, and the scale counts its lines all the same. It needs: criterion_group! and \
  criterion_main! (25); reading the --bench flag cargo passes, --quick and a name filter from \
  std::env::args (40); Criterion with bench_function and benchmark_group, the group's \
  bench_function and finish, and group/name ids (80); Bencher's iter, iter_batched with \
  SmallInput and iter_batched_ref with PerIteration, timed with std::time::Instant and \
  std::hint::black_box (90); a warm-up, then 100 samples whose iteration counts grow linearly to \
  fill the measurement time (80); quick mode, which doubles the iteration count until two \
  samples agree within 5% (35); the statistics, which are per-iteration times, mean, median, \
  standard deviation, median absolute deviation and Tukey's fences for outliers (110); writing \
  new/estimates.json in the shape CI reads, with serde_json, a direct dependency (40); and a \
  text report of each median and its outliers (50): 550 lines. It leaves out what nothing here \
  reads: bootstrap confidence intervals, comparison with a saved baseline, the HTML report and \
  its plots through gnuplot or plotters, CSV output, async benchmarks and custom measurements. \
  Replacing it removes 32 packages from Cargo.lock: aho-corasick@1, anes@0.1, anstyle@1, \
  cast@0.3, ciborium-io@0.2, ciborium-ll@0.2, ciborium@0.2, clap@4, clap_builder@4, clap_lex@1, \
  criterion-plot@0.6, criterion@0.7, crossbeam-deque@0.8, crossbeam-epoch@0.9, \
  crossbeam-utils@0.8, crunchy@0.2, either@1, half@2, itertools@0.13, oorandom@11, \
  plotters-backend@0.3, plotters-svg@0.3, plotters@0.3, rayon-core@1, rayon@1, \
  regex-automata@0.4, regex@1, same-file@1, tinytemplate@1, walkdir@2, web-sys@0.3 and \
  winapi-util@0.1. The other 33 packages it brings stay, because another direct dependency \
  brings each of them too. proptest keeps six of them, autocfg@1, num-traits@0.2, \
  regex-syntax@0.8, syn@2, zerocopy@0.8 and zerocopy-derive@0.8, and replacing both removes \
  those as well.\
  """
