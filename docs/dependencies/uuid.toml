name = "uuid"
range = "1"
reason = """\
  Generates random version 4 UUIDs, and parses and prints the canonical hyphenated text of a UUID, \
  for grant identities and registry IDs.\
  """
write_it_instead.lines = 70
write_it_instead.how = """\
  On 2026-10-20, at main 2b321cb, `git grep -l 'uuid::' -- '*.rs' | wc -l` gives 2 files, \
  crates/plasmosome-backend/src/universe.rs and crates/plasmosome-ledger/src/artifact.rs. `git \
  grep -h -o -E 'Uuid::(new_v4|parse_str)|[.](hyphenated|is_nil|get_variant|get_version)[(]' -- \
  '*.rs' | tr -d '.(' | sort | uniq -c` gives hyphenated 5, parse_str 3, one of them in a doc \
  comment, is_nil 2, new_v4 1, get_variant 1 and get_version 1. Each file holds the UUID in a \
  newtype that derives Debug, Clone, Copy, Eq, Ord and Hash through it and writes its own serde \
  impls over the text, so a replacement needs no serde support. Both newtypes refuse every text \
  but the lower-case hyphenated form after parsing. A replacement with the standard library alone \
  needs: a 16-byte type with those derives, is_nil, and the variant and version checks (20 lines); \
  new_v4, 16 bytes read from /dev/urandom with the version and variant bits set, where getrandom \
  calls getentropy on macOS and the getrandom system call on Linux (15); parse_str for the \
  lower-case hyphenated form only, 32 hex digits with a hyphen after the 8th, 12th, 16th and 20th \
  (25); and hyphenated, which writes that form (10): 70 lines. Replacing it removes 1 package from \
  Cargo.lock: uuid@1.\
  """
exception = ""
# The two hosts build cfg-if, getrandom, libc and serde_core of these. The rest are here through
# uuid's wasm32-only dependencies on wasm-bindgen and js-sys, getrandom's UEFI-only one on r-efi,
# and serde_core's cfg(any()) one on serde_derive. So build_time_code holds none of them.
brings = [
  "bumpalo@3",
  "cfg-if@1",
  "futures-core@0.3",
  "futures-task@0.3",
  "futures-util@0.3",
  "getrandom@0.4",
  "js-sys@0.3",
  "libc@0.2",
  "once_cell@1",
  "pin-project-lite@0.2",
  "proc-macro2@1",
  "quote@1",
  "r-efi@6",
  "rustversion@1",
  "serde_core@1",
  "serde_derive@1",
  "slab@0.4",
  "syn@3",
  "unicode-ident@1",
  "wasm-bindgen-macro-support@0.2",
  "wasm-bindgen-macro@0.2",
  "wasm-bindgen-shared@0.2",
  "wasm-bindgen@0.2",
]
build_time_code = [
  "getrandom@0.4 build script",
  "libc@0.2 build script",
  "serde_core@1 build script",
]
expands_unsafe = "none"
native_code = [
  """\
  libc@0.2 links the system libiconv on macOS, through the #[link(name = "iconv")] that libc.toml \
  describes. libc builds here on both hosts, because getrandom@0.4 depends on it on macOS and on \
  Linux with glibc. None of the three build scripts compiles C or links a library.\
  """,
]
verdict = "kept-pending-owner"
