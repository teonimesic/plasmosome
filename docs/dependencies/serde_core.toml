name = "serde_core"
range = "1"
reason = """\
  Gives the membrane's strict JSON reader the deserialization traits it drives serde_json \
  with, so that a duplicate object key is refused while parsing. It is serde without the \
  derive.\
  """
write_it_instead.lines = 700
write_it_instead.how = """\
  git grep -n 'serde_core' finds one file, \
  crates/plasmosome-membrane/src/runtime/strict_json.rs. It uses DeserializeSeed, Visitor, \
  MapAccess, SeqAccess and de::Error to walk serde_json's Deserializer. Those traits are \
  useful only because serde_json implements them, so writing this here means a strict JSON \
  reader of our own: a tokenizer, string escapes and surrogate pairs, numbers split into i64, \
  u64 and f64 as serde_json splits them, a nesting bound, and line and column errors with \
  serde_json's reasons, which the module's tests compare against. That is about 700 lines. \
  serde, serde_json and uuid bring serde_core too, so it would stay locked.\
  """
exception = ""
brings = ["proc-macro2@1", "quote@1", "serde_derive@1", "syn@3", "unicode-ident@1"]
build_time_code = ["serde_core@1 build script"]
expands_unsafe = "none"
native_code = "none"
verdict = "kept-pending-owner"
