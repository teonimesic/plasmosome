# Every gate is its own step: a `run: |` block reports only its last command's exit status,
# so a multi-command step can pass while a gate inside it failed. One command per step.
# The exception is a captured test step: one pipeline, `cargo test ... 2>&1 | tee -a FILE`, under
# `shell: bash`. GitHub runs that as `bash --noprofile --norc -eo pipefail`, so the step fails when
# any command in the pipeline fails. The default shell has no pipefail, and the step would pass
# because tee succeeded.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# `rust-toolchain.toml` names the compiler. Each job that builds Rust installs it with
# `rustup toolchain install`, which reads that file; `--no-self-update` stops rustup replacing
# itself with whatever release is newest. With auto-install off, a job that skips the install
# fails before it builds anything, instead of downloading a toolchain no step names.
env:
  RUSTUP_AUTO_INSTALL: "0"

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: install the pinned toolchain
        run: rustup toolchain install --no-self-update

      - name: toolchain in use
        run: rustup show active-toolchain --verbose

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: run quick benchmarks
        run: cargo bench --locked --workspace -- --quick

      - name: publish benchmark medians
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("target/criterion")
          benchmarks = (
              "attach_detach",
              "ledger_replay/10",
              "ledger_replay/100",
              "ledger_replay/1000",
              "manifest_parse",
              "reconciler_step",
              "session_log_append",
              "session_log_read",
          )
          lines = ["## Kernel benchmark medians", "", "FakeBackend timings exclude OS enforcement.", ""]
          for name in benchmarks:
              estimates = json.loads((root / name / "new/estimates.json").read_text())
              median_ns = estimates["median"]["point_estimate"]
              lines.append(f"- `{name}` {median_ns:.6f} ns")
          summary = "\n".join(lines) + "\n"
          print(summary, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PY

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Spec 026's git-only step. Nothing from the commit may run before it: a program run by an
      # earlier step can rewrite PATH for every later one through $GITHUB_PATH. Only gates runs it,
      # as spec 026 section 1 asks; macos, bench and coverage do not. What a pull request's run
      # leaves in a cache is plasmosome-ofaf's.
      - name: git-only step
        run: ./.githooks/build-input-guard HEAD

      - name: install the pinned toolchain
        run: rustup toolchain install --no-self-update

      - name: toolchain in use
        run: rustup show active-toolchain --verbose

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cargo-deny-0.20.2

      - name: format
        run: cargo fmt --all -- --check

      - name: cargo-deny check regression
        run: python3 tools/cargo-deny-check-regression.py

      - name: security issue regression
        run: python3 tools/security-issue-regression.py

      # Bump with the steps in tools/cargo-deny-check's docstring; the rust-cache key must match.
      - name: install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo-deny sources
        run: python3 tools/cargo-deny-check sources

      - name: cargo-deny advisories
        if: github.event_name == 'pull_request'
        run: python3 tools/cargo-deny-check advisories --changed-since HEAD^1

      - name: cargo-deny licence report
        if: github.event_name == 'pull_request'
        run: python3 tools/cargo-deny-check licenses --changed-since HEAD^1

      - name: ignored tests regression
        run: python3 tools/ignored-tests-regression.py

      # `macos` runs these four steps too, from clippy to the ignored-test report. Change both jobs.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::ignore_without_reason

      - name: tests
        id: tests
        shell: bash
        run: cargo test --locked --workspace --exclude plasmosome-guards --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/cargo-test.log"

      - name: workspace guards
        id: guards
        shell: bash
        run: cargo test --locked -p plasmosome-guards --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/cargo-test.log"

      - name: ignored tests
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          GUARDS: ${{ steps.guards.outcome }}
        run: python3 tools/ignored_tests.py "$RUNNER_TEMP/cargo-test.log" "tests=$TESTS=--workspace --exclude plasmosome-guards" "workspace guards=$GUARDS=-p plasmosome-guards"

      - name: provenance guard
        run: ./.githooks/provenance-guard

      # On a push there is no base ref, and `origin/main..HEAD` is then an empty range the guard
      # clears without reading a commit. A squash merge composes a message GitHub never showed the
      # pull request, so the commit landing on main is exactly the one worth reading. A ref being
      # created reports forty zeroes as its previous tip, which resolves to nothing, so that case
      # reads the whole history the push brought with it.
      # The read runs even after an earlier step failed. On a push, the next push's range starts at
      # this push's tip, so a commit this run does not read is never read by a later run (spec 029).
      - name: attribution guard
        if: ${{ !cancelled() }}
        env:
          RANGE: ${{ github.base_ref && format('origin/{0}..HEAD', github.base_ref) || (github.event.before == '0000000000000000000000000000000000000000' && github.sha || format('{0}..{1}', github.event.before, github.sha)) }}
        run: ./.githooks/attribution-guard "$RANGE"

      - name: pipeline review usage regression
        run: python3 tools/pipeline-review-usage-regression.py

      - name: check pipeline health regression
        run: python3 tools/check-pipeline-health-regression.py

      - name: root image regression
        run: python3 tools/root-image-regression.py

      - name: quickstart regression
        run: python3 tools/quickstart-regression.py

      - name: download pinned beads
        id: beads
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import os
          import runpy
          import shutil
          import sys
          import tarfile
          import tomllib
          import urllib.request
          from pathlib import Path

          launcher = runpy.run_path("tools/work-state")
          pin = launcher["release_pin"]()
          manifest = tomllib.loads(Path("tools/work-state-beads-1.1.2.toml").read_text())
          url = manifest["checksums_url"].rsplit("/", 1)[0] + "/" + pin["archive"]
          directory = Path(os.environ["RUNNER_TEMP"]) / "beads"
          directory.mkdir()
          archive = directory / pin["archive"]
          with urllib.request.urlopen(url, timeout=120) as response, archive.open("wb") as output:
              shutil.copyfileobj(response, output)
          print(f"Python {sys.version.split()[0]}, {pin['target']}")
          archive_digest = launcher["digest"](archive)
          print(f"{archive_digest}  {archive}")
          if archive_digest != pin["archive_sha256"]:
              sys.exit(f"{archive.name} SHA-256 is {archive_digest}, not the pinned {pin['archive_sha256']}")
          binary = directory / "bd"
          with tarfile.open(archive) as bundle:
              member = next((item for item in bundle.getmembers() if item.isfile() and os.path.normpath(item.name) == "bd"), None)
              if member is None:
                  sys.exit(f"{archive.name} has no regular file named bd")
              with bundle.extractfile(member) as source, binary.open("wb") as output:
                  shutil.copyfileobj(source, output)
          binary_digest = launcher["digest"](binary)
          print(f"{binary_digest}  {binary}")
          if binary_digest != pin["binary_sha256"]:
              sys.exit(f"bd SHA-256 is {binary_digest}, not the pinned {pin['binary_sha256']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"archive={archive}\nbinary={binary}\n")
          PY

      - name: work-state regression
        timeout-minutes: 15
        env:
          ARCHIVE: ${{ steps.beads.outputs.archive }}
          BINARY: ${{ steps.beads.outputs.binary }}
        run: python3 tools/work-state-regression.py --archive "$ARCHIVE" --bd "$BINARY"

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: install the pinned toolchain
        run: rustup toolchain install --no-self-update

      - name: toolchain in use
        run: rustup show active-toolchain --verbose

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # These four steps match the four in `gates`, from clippy to the ignored-test report. Change both jobs.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::ignore_without_reason

      - name: tests
        id: tests
        shell: bash
        run: cargo test --locked --workspace --exclude plasmosome-guards --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/cargo-test.log"

      - name: workspace guards
        id: guards
        shell: bash
        run: cargo test --locked -p plasmosome-guards --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/cargo-test.log"

      - name: ignored tests
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          GUARDS: ${{ steps.guards.outcome }}
        run: python3 tools/ignored_tests.py "$RUNNER_TEMP/cargo-test.log" "tests=$TESTS=--workspace --exclude plasmosome-guards" "workspace guards=$GUARDS=-p plasmosome-guards"

  coverage:
    runs-on: ubuntu-latest
    # `Swatinem/rust-cache` sets this in the jobs that use it; this job has no cache step.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install the pinned toolchain
        run: rustup toolchain install --no-self-update

      - name: toolchain in use
        run: rustup show active-toolchain --verbose

      - name: add llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: clean coverage data
        run: cargo llvm-cov clean --locked --workspace

      - name: measured run
        run: cargo llvm-cov --locked --workspace --exclude plasmosome-guards --no-report

      - name: coverage summary
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          table = subprocess.run(
              ["cargo", "llvm-cov", "report", "--locked", "--summary-only"],
              check=True,
              stdout=subprocess.PIPE,
              text=True,
          ).stdout
          runner = " ".join(os.environ.get(name, f"{name} unset") for name in ("RUNNER_OS", "RUNNER_ARCH"))
          image = " ".join(os.environ.get(name, f"{name} unset") for name in ("ImageOS", "ImageVersion"))
          lines = [
              "## Coverage of the workspace tests",
              "",
              f"Measured on {runner}, runner image {image}.",
              "",
              "`plasmosome-guards` is excluded: its tests read the repository and drive nested cargo builds.",
              "",
              'Code compiled only for macOS, under `cfg(target_os = "macos")` or `cfg(not(target_os = "linux"))`, is not compiled on Linux, so it is absent from the count.',
              "",
              "Doctests are not measured: the run is `cargo test --tests`, which skips them.",
              "",
              "```",
              table.rstrip("\n"),
              "```",
          ]
          summary = "\n".join(lines) + "\n"
          print(summary, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PY

      - name: lcov report
        run: cargo llvm-cov report --locked --lcov --output-path lcov.info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
