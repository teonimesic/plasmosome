# Separate from `ci.yml` on purpose, because a red run means something different per trigger.
# On the schedule: a new advisory landed against code nobody touched. On a pull request: that
# pull request's `Cargo.lock` brought a known-vulnerable dependency in. On a manual dispatch:
# whatever the person running it wanted to know. One workflow carrying both triggers makes the
# scheduled meaning unreadable, which is the one nobody is watching for.
#
# `cargo-audit` is pinned. Installing the latest release would let a version published upstream
# change what this job accepts, with no commit in this repository saying so.
name: audit

on:
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - Cargo.lock
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

# Auto-install is off for the reason `ci.yml` gives.
env:
  RUSTUP_AUTO_INSTALL: "0"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install the pinned toolchain
        run: rustup toolchain install --no-self-update

      - name: toolchain in use
        run: rustup show active-toolchain --verbose

      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: audit
        run: cargo audit --deny warnings
