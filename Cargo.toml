[workspace]
resolver = "2"
members = [
    "crates/plasmosome",
    "crates/plasmosome-backend",
    "crates/plasmosome-ledger",
    "crates/plasmosome-core",
    "crates/plasmosome-membrane",
    "crates/plasmid",
    "crates/plasmid-sdk",
    "crates/plasmosome-guards",
    "crates/plasmosome-testkit",
    "crates/plasmosome-work-state",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
proptest = "1"
tempfile = "3"
libc = "0.2"
sha2 = "0.10"

plasmosome-backend = { path = "crates/plasmosome-backend" }
plasmosome-ledger = { path = "crates/plasmosome-ledger" }
plasmosome-core = { path = "crates/plasmosome-core" }
