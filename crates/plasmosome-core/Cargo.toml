[package]
name = "plasmosome-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
plasmosome-backend = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_core = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true, features = ["parse"] }

[lib]
name = "plasmosome_core"
path = "src/lib.rs"
bench = false

[[bin]]
name = "plasmosomed"
path = "src/main.rs"
bench = false

[[test]]
name = "supervisor_start"
path = "tests/supervisor_start.rs"
harness = false

[[bench]]
name = "manifest_parse"
harness = false

[[bench]]
name = "reconciler_step"
harness = false

[[bench]]
name = "session_log_append"
harness = false

[[bench]]
name = "session_log_read"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
