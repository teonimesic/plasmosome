[package]
name = "plasmosome-lanes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "plasmosome_lanes"
path = "src/lib.rs"
bench = false

[[bin]]
name = "lane-vmm"
path = "src/bin/lane_vmm.rs"
bench = false

[[bin]]
name = "lane-init"
path = "src/bin/lane_init.rs"
bench = false

[[bin]]
name = "lane-probe"
path = "src/bin/lane_probe.rs"
bench = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[package.metadata.ofaf-throwaway]
reverted = "in this pull request"
