[package]
name = "plasmid"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The command line for authoring plasmids, the capability modules of the Plasmosome kernel."
repository = "https://github.com/teonimesic/plasmosome"
readme = "README.md"
publish = ["crates-io"]
exclude = ["AGENTS.md", "CLAUDE.md"]

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "plasmid"
path = "src/main.rs"
bench = false
