[package]
name = "plasmosome-membrane"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true }
libc = { workspace = true }
plasmosome-backend = { workspace = true }
plasmosome-core = { workspace = true }

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "plasmosome_membrane"
path = "src/lib.rs"
bench = false

[[bin]]
name = "membraned"
path = "src/main.rs"
bench = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
